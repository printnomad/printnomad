<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrintNomad</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <div id="onboarding" class="flex min-h-screen flex-col" hidden>
      <div class="flex items-center justify-between gap-4 px-6 py-6 lg:px-16">
        <span class="flex items-center gap-2.5"><span class="grid size-9 place-items-center rounded-[10px] bg-dark"><svg viewBox="0 0 24 24" class="size-[26px]" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M11 6h2" stroke="#FFFFFF"/><path d="M9.5 9h5" stroke="#00AE42"/><path d="M8 12h8" stroke="#FA6831"/><path d="M6.5 15h4.5M13 15h4.5" stroke="#3D8BFD"/><path d="M5 18h5.5M13.5 18h5.5" stroke="#1FB5A0"/></svg></span>
          <span class="font-display text-xl font-black tracking-[-0.2px]">Print<span class="text-accent">Nomad</span></span></span>
        <span class="flex items-center gap-3">
          <span id="onboarding-progress" class="flex items-center gap-2 text-sm font-semibold text-muted">
            <span class="h-1.5 w-7 rounded-[3px] bg-accent"></span><span id="progress-2" class="h-1.5 w-7 rounded-[3px] bg-strong"></span>
            <span id="progress-text" class="ml-1.5"></span>
          </span>
          <button id="onboarding-cancel" type="button" class="btn-ghost" data-i18n="onboarding_cancel" hidden></button>
        </span>
      </div>

      <section id="step-1" class="flex flex-1 flex-col" aria-labelledby="step-1-title">
        <div class="flex flex-1 flex-col gap-6 px-6 pt-4 pb-8 lg:px-16">
          <div class="flex flex-col gap-2.5">
            <h1 id="step-1-title" class="m-0 text-4xl tracking-[-1px] sm:text-5xl" data-i18n="onboarding_1_title"></h1>
            <p id="onboarding-subtitle" class="m-0 text-lg text-muted"></p>
          </div>
          <div class="flex flex-wrap items-center gap-3">
            <label class="flex min-h-[52px] flex-[0_1_420px] items-center gap-2.5 rounded-full border-[1.5px] border-line bg-surface px-[18px] text-muted">
              <svg viewBox="0 0 24 24" class="size-[18px] shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <span class="sr-only" data-i18n="picker_search_label"></span>
              <input id="picker-search" type="search" autocomplete="off" class="min-w-0 flex-1 bg-transparent text-base text-fg outline-none" data-i18n-placeholder="picker_search" />
            </label>
            <div id="picker-brands" class="flex flex-wrap gap-2" role="group" data-i18n-aria="picker_brands"></div>
          </div>
          <div id="picker-models" class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5"></div>
          <p id="picker-empty" class="py-6 text-center text-muted" data-i18n="picker_empty" hidden></p>
        </div>
        <div class="sticky bottom-0 flex flex-wrap items-center justify-between gap-3 border-t border-line bg-surface px-6 py-5 lg:px-16">
          <div id="printer-request-prompt" class="flex flex-wrap items-center gap-2 text-[15px] text-muted">
            <span data-i18n="request_prompt"></span>
            <button id="printer-request-open" type="button" class="inline-flex min-h-11 cursor-pointer items-center font-semibold text-accent-strong underline" data-i18n="request_open"></button>
            <form id="printer-request" class="flex flex-wrap items-center gap-2" hidden>
              <label class="min-w-0"><span class="sr-only" data-i18n="printer_request_label"></span><input id="printer-request-name" type="text" maxlength="100" class="field min-h-11 rounded-full bg-bg" data-i18n-placeholder="printer_request_label" /></label>
              <button type="submit" class="row-action" data-i18n="printer_request_send"></button>
              <span id="printer-request-result" class="text-sm" role="status"></span>
            </form>
          </div>
          <button id="step-1-next" type="button" class="inline-flex min-h-[52px] cursor-pointer items-center gap-2.5 rounded-full bg-accent px-7 text-base font-bold text-white hover:bg-accent-strong disabled:cursor-not-allowed disabled:opacity-50"><span id="step-1-next-label"></span><svg viewBox="0 0 24 24" class="size-[18px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
        </div>
      </section>

      <form id="step-2-form" class="contents">
      <section id="step-2" class="flex flex-1 flex-col" aria-labelledby="step-2-title" hidden>
        <div class="flex flex-1 flex-wrap gap-12 px-6 pt-4 pb-8 lg:flex-nowrap lg:px-16">
          <div class="flex min-w-0 flex-[1_1_480px] flex-col gap-7">
            <div class="flex flex-col gap-2.5">
              <h1 id="step-2-title" class="m-0 text-4xl tracking-[-1px] sm:text-5xl" data-i18n="onboarding_2_title"></h1>
              <p class="m-0 text-lg text-muted" data-i18n="onboarding_2_hint"></p>
            </div>
            <div  class="flex flex-col gap-3.5 rounded-[18px] bg-surface px-6 py-[22px]">
              <div class="flex flex-wrap items-baseline justify-between gap-3"><span id="setup-nozzles-label" class="font-bold" data-i18n="picker_nozzle"></span><span class="text-[13px] text-muted" data-i18n="setup_nozzle_hint"></span></div>
              <div id="setup-nozzles" role="radiogroup" aria-labelledby="setup-nozzles-label" class="flex flex-wrap gap-2"></div>
            </div>
            <div id="setup-bed-group" class="flex flex-col gap-3.5 rounded-[18px] bg-surface px-6 py-[22px]">
              <div class="flex flex-wrap items-baseline justify-between gap-3"><span id="setup-beds-label" class="font-bold" data-i18n="printers_bed"></span><span class="text-[13px] text-muted" data-i18n="setup_bed_hint"></span></div>
              <div id="setup-beds" role="radiogroup" aria-labelledby="setup-beds-label" class="flex flex-wrap gap-2"></div>
            </div>
            <div  class="flex flex-col gap-3.5 rounded-[18px] bg-surface px-6 py-[22px]">
              <div class="flex flex-wrap items-baseline justify-between gap-3"><span id="setup-slicers-label" class="font-bold" data-i18n="printers_slicer"></span><span class="text-[13px] text-muted" data-i18n="setup_slicer_hint"></span></div>
              <div id="setup-slicers" role="radiogroup" aria-labelledby="setup-slicers-label" class="flex flex-wrap gap-2"></div>
            </div>
          </div>
          <div class="flex w-full flex-col gap-4 pt-2 lg:w-[360px] lg:shrink-0">
            <div class="flex flex-col gap-[18px] rounded-[22px] bg-dark p-7 text-white">
              <span class="grid size-28 place-items-center rounded-[18px] bg-white"><img id="setup-cover" class="size-[88px] object-contain" alt="" /></span>
              <div class="flex flex-col gap-0.5"><span id="setup-brand" class="text-xs font-bold tracking-[1px] text-dark-muted uppercase"></span><span id="setup-name" class="text-2xl font-bold"></span></div>
              <div id="setup-summary" class="text-[15px] leading-normal text-dark-text"></div>
              <div class="flex items-center gap-2 text-[13px] text-mint"><svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg><span data-i18n="setup_profiles"></span></div>
            </div>
            <div class="px-1 text-sm leading-normal text-muted" data-i18n="setup_prefs_note"></div>
          </div>
        </div>
        <div class="sticky bottom-0 flex flex-wrap items-center justify-between gap-3 border-t border-line bg-surface px-6 py-5 lg:px-16">
          <span class="flex flex-wrap items-center gap-2">
            <button id="setup-back" type="button" class="inline-flex min-h-12 cursor-pointer items-center rounded-full px-5 text-base font-semibold hover:bg-bg"></button>
            <button id="setup-remove" type="button" class="row-action text-err" data-i18n="printers_remove" hidden></button>
          </span>
          <button id="setup-finish" type="submit" class="inline-flex min-h-[52px] cursor-pointer items-center gap-2.5 rounded-full bg-accent px-7 text-base font-bold text-white hover:bg-accent-strong"><span id="setup-finish-label"></span></button>
        </div>
      </section>
      </form>

      <section id="step-3" class="flex flex-1 items-center justify-center px-6 pb-10 lg:px-16" aria-labelledby="step-3-title" hidden>
        <div class="flex w-full max-w-[1080px] flex-wrap items-center gap-16 lg:flex-nowrap">
          <div class="flex min-w-0 flex-[1_1_380px] flex-col gap-[22px]">
            <span class="grid size-16 place-items-center rounded-full bg-accent text-white"><svg viewBox="0 0 24 24" class="size-8" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span>
            <h1 id="step-3-title" class="m-0 text-5xl leading-none tracking-[-1.5px] sm:text-[60px]" data-i18n="onboarding_3_title"></h1>
            <p class="m-0 max-w-[480px] text-[19px] leading-[1.55] text-fg-2" data-i18n="onboarding_3_text"></p>
            <div class="mt-2 flex flex-wrap gap-3">
              <a href="https://makerworld.com" target="_blank" rel="noopener" class="inline-flex min-h-[52px] items-center gap-2 rounded-full bg-accent px-[26px] text-base font-bold text-white"><span data-i18n="open_makerworld"></span><svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></a>
              <button id="done-preferences" type="button" class="inline-flex min-h-[52px] cursor-pointer items-center rounded-full border-[1.5px] border-[var(--pn-border-dashed)] bg-transparent px-6 text-base font-semibold" data-i18n="onboarding_see_prefs"></button>
            </div>
            <div class="mt-3 flex items-center gap-2.5 text-sm text-muted"><svg viewBox="0 0 24 24" class="size-[18px] shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg><span data-i18n="onboarding_pin_tip"></span></div>
          </div>
          <div class="flex w-full flex-col gap-4 rounded-3xl bg-surface p-7 lg:w-[440px] lg:shrink-0">
            <div class="text-xs font-bold tracking-[1px] text-muted uppercase" data-i18n="onboarding_every_model"></div>
            <div class="h-40 rounded-[14px] bg-[#E6E7EB]"></div>
            <div class="h-3.5 w-3/5 rounded-[7px] bg-[#E6E7EB]"></div>
            <div class="h-2.5 w-[35%] rounded-[5px] bg-line-soft"></div>
            <div class="flex min-h-[52px] w-fit items-center gap-2.5 rounded-[var(--pn-r-inner)] bg-accent px-5 text-base font-bold text-white shadow-[var(--pn-ring)]"><svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg><span id="done-button-label"></span></div>
            <div class="text-[13px] text-muted" data-i18n="onboarding_look_for"></div>
          </div>
        </div>
      </section>
    </div>

    <div id="home-view">
    <header class="border-b border-line bg-surface">
      <div class="mx-auto flex max-w-[var(--pn-page-max)] flex-wrap items-center justify-between gap-4 px-6 py-4">
        <div class="flex items-center gap-2.5">
          <span class="grid size-9 place-items-center rounded-[10px] bg-dark"><svg viewBox="0 0 24 24" class="size-[26px]" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M11 6h2" stroke="#FFFFFF"/><path d="M9.5 9h5" stroke="#00AE42"/><path d="M8 12h8" stroke="#FA6831"/><path d="M6.5 15h4.5M13 15h4.5" stroke="#3D8BFD"/><path d="M5 18h5.5M13.5 18h5.5" stroke="#1FB5A0"/></svg></span>
          <span class="font-display text-xl font-black tracking-[-0.2px]">Print<span class="text-accent">Nomad</span></span>
        </div>
        <nav class="flex flex-wrap gap-1" data-i18n-aria="nav_label">
          <a href="#prefs" class="nav-link" data-i18n="nav_prefs"></a>
          <a href="#printers-section" class="nav-link" data-i18n="nav_printers"></a>
          <a href="#convert" class="nav-link" data-i18n="nav_convert"></a>
        </nav>
      </div>
    </header>

    <main id="home" class="mx-auto flex max-w-[var(--pn-page-max)] flex-col gap-[var(--pn-section-gap)] px-6 pt-10 pb-20">
      <!-- Hero -->
      <section class="relative flex min-h-[420px] items-center overflow-hidden rounded-[var(--pn-r-hero)] bg-dark px-7 py-12 text-white sm:px-14 sm:py-16">
        <div class="relative z-10 flex max-w-[460px] min-w-0 flex-col gap-[22px]">
          <div class="inline-flex items-center gap-2 text-[13px] font-bold tracking-[1.2px] text-mint uppercase"><span class="size-2 rounded-full bg-mint"></span><span data-i18n="hero_eyebrow"></span></div>
          <h1 class="m-0 text-5xl leading-[0.98] tracking-[-1.5px] sm:text-[64px]" data-i18n="hero_title"></h1>
          <p class="m-0 text-lg leading-[1.55] text-dark-text"><span data-i18n="hero_before"></span> <strong id="hero-action" class="text-white"></strong><span data-i18n="hero_after"></span></p>
          <div class="mt-1 flex flex-wrap gap-3">
            <a href="https://makerworld.com" target="_blank" rel="noopener" class="inline-flex min-h-12 items-center gap-2 rounded-full bg-mint px-[22px] text-base font-bold text-mint-ink"><span data-i18n="open_makerworld"></span><svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></a>
          </div>
          <div class="text-sm text-dark-muted"><span id="hero-default"></span> · <a href="#printers-section" class="inline-flex min-h-11 items-center font-semibold text-mint" data-i18n="hero_change"></a></div>
        </div>
        <img src="icons/hero-slicers.svg" alt="" class="pointer-events-none absolute top-1/2 right-14 hidden w-[500px] max-w-[44%] -translate-y-[42%] min-[1120px]:block" />
      </section>

      <!-- Conversion preferences -->
      <section id="prefs" class="flex scroll-mt-6 flex-col gap-5" aria-labelledby="prefs-title">
        <div class="flex max-w-[720px] flex-col gap-2">
          <h2 id="prefs-title" class="m-0 text-[34px] tracking-[-0.5px]" data-i18n="prefs_title"></h2>
          <p class="m-0 text-[17px] leading-[1.55] text-muted" data-i18n="prefs_intro"></p>
        </div>
        <div class="rounded-[var(--pn-r-card)] bg-surface px-7 py-2">
          <div class="flex flex-col gap-1 pt-5 pb-3">
            <h3 class="m-0 text-lg font-bold" data-i18n="keep_title"></h3>
            <p class="m-0 text-[15px] text-muted" data-i18n="keep_hint"></p>
          </div>
          <div data-pref class="flex flex-col gap-4 border-t border-line-soft py-5">
            <div class="flex items-center justify-between gap-5">
              <div class="flex min-w-0 items-center gap-4">
                <span data-icon-tile class="grid size-12 shrink-0 place-items-center rounded-[14px]"><svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 11v6"/></svg></span>
                <div class="flex min-w-0 flex-col gap-1">
                  <div class="flex flex-wrap items-center gap-2"><span id="label-temps" class="font-semibold" data-i18n="pref_temps"></span><span class="rounded-full bg-accent-soft px-2 py-[3px] text-xs font-bold text-accent-strong" data-i18n="pref_recommended"></span></div>
                  <span class="text-sm leading-normal text-muted" data-i18n="pref_temps_desc"></span>
                </div>
              </div>
              <button type="button" role="switch" data-option="keep_designer_filament" aria-labelledby="label-temps" class="toggle"><span></span></button>
            </div>
          </div>
          <div data-pref class="flex flex-col gap-4 border-t border-line-soft py-5">
            <div class="flex items-center justify-between gap-5">
              <div class="flex min-w-0 items-center gap-4">
                <span data-icon-tile class="grid size-12 shrink-0 place-items-center rounded-[14px]"><svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1.5"/><path d="M12 10.5C11 7 12 4 15 4c2 0 2 3 0 4.5l-3 2z"/><path d="M13.5 12c3.5-1 6.5 0 6.5 3 0 2-3 2-4.5 0l-2-3z"/><path d="M10.5 12.5C10 16 8 19 5.5 18c-1.8-.8-.8-3.5 1.5-4.2l3.5-1.3z"/></svg></span>
                <div class="flex min-w-0 flex-col gap-1">
                  <div class="flex flex-wrap items-center gap-2"><span id="label-cooling" class="font-semibold" data-i18n="pref_cooling"></span></div>
                  <span class="text-sm leading-normal text-muted" data-i18n="pref_cooling_desc"></span>
                </div>
              </div>
              <button type="button" role="switch" data-option="keep_designer_cooling" aria-labelledby="label-cooling" class="toggle"><span></span></button>
            </div>
            <div data-warning="cooling" role="note" class="flex flex-col gap-4 rounded-[var(--pn-r-tile)] border border-warn-border bg-warn-bg px-5 py-[18px]" hidden>
              <div class="flex items-start gap-3">
                <svg viewBox="0 0 24 24" class="mt-px size-5 shrink-0 text-warn-icon" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5"/><path d="M12 18h.01"/></svg>
                <div class="flex flex-col gap-1"><span class="text-[15px] font-bold text-warn-title" data-i18n="pref_cooling_warn_title"></span><span class="text-sm leading-normal text-warn" data-i18n="pref_cooling_warn"></span></div>
              </div>
              <div class="flex flex-col gap-2.5 rounded-[var(--pn-r-inner)] bg-surface px-4 py-3.5">
                <div class="flex flex-wrap items-center justify-between gap-2.5"><span data-example-title class="text-[13px] font-bold"></span><span class="rounded-full bg-bg px-2.5 py-[3px] text-xs font-semibold text-fg-2" data-i18n="pref_illustrative"></span></div>
                <div class="grid gap-2 sm:grid-cols-3">
                  <div class="flex flex-col gap-1.5 rounded-[10px] bg-sunken px-3 py-2.5">
                    <span class="text-xs text-muted" data-i18n="pref_cooling_row1"></span>
                    <span class="flex flex-wrap items-baseline gap-1.5"><span class="text-[13px] text-faint line-through">80%</span><span class="text-[17px] font-bold text-warn">100%</span><span class="text-xs font-bold text-warn" data-i18n="pref_higher"></span></span>
                  </div><div class="flex flex-col gap-1.5 rounded-[10px] bg-sunken px-3 py-2.5">
                    <span class="text-xs text-muted" data-i18n="pref_cooling_row2"></span>
                    <span class="flex flex-wrap items-baseline gap-1.5"><span class="text-[13px] text-faint line-through">70%</span><span class="text-[17px] font-bold text-warn">100%</span><span class="text-xs font-bold text-warn" data-i18n="pref_higher"></span></span>
                  </div><div class="flex flex-col gap-1.5 rounded-[10px] bg-sunken px-3 py-2.5">
                    <span class="text-xs text-muted" data-i18n="pref_cooling_row3"></span>
                    <span class="flex flex-wrap items-baseline gap-1.5"><span class="text-[13px] text-faint line-through">3</span><span class="text-[17px] font-bold text-warn">1</span><span class="text-xs font-bold text-warn" data-i18n="pref_lower"></span></span>
                  </div>
                </div>
                <span class="text-[13px] leading-normal text-fg-2"><strong data-i18n="pref_cooling_verdict"></strong> <span data-i18n="pref_cooling_advice"></span></span>
              </div>
            </div>
          </div>
          <div data-pref class="flex flex-col gap-4 border-t border-line-soft py-5">
            <div class="flex items-center justify-between gap-5">
              <div class="flex min-w-0 items-center gap-4">
                <span data-icon-tile class="grid size-12 shrink-0 place-items-center rounded-[14px]"><svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span>
                <div class="flex min-w-0 flex-col gap-1">
                  <div class="flex flex-wrap items-center gap-2"><span id="label-tuning" class="font-semibold" data-i18n="pref_tuning"></span><span class="rounded-full bg-tag-adv px-2 py-[3px] text-xs font-bold text-tag-adv-fg" data-i18n="pref_advanced"></span></div>
                  <span class="text-sm leading-normal text-muted" data-i18n="pref_tuning_desc"></span>
                </div>
              </div>
              <button type="button" role="switch" data-option="keep_designer_printer_settings" aria-labelledby="label-tuning" class="toggle"><span></span></button>
            </div>
            <div data-warning="tuning" role="note" class="flex flex-col gap-4 rounded-[var(--pn-r-tile)] border border-warn-border bg-warn-bg px-5 py-[18px]" hidden>
              <div class="flex items-start gap-3">
                <svg viewBox="0 0 24 24" class="mt-px size-5 shrink-0 text-warn-icon" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5"/><path d="M12 18h.01"/></svg>
                <div class="flex flex-col gap-1"><span class="text-[15px] font-bold text-warn-title" data-i18n="pref_tuning_warn_title"></span><span class="text-sm leading-normal text-warn" data-i18n="pref_tuning_warn"></span></div>
              </div>
              <div class="flex flex-col gap-2.5 rounded-[var(--pn-r-inner)] bg-surface px-4 py-3.5">
                <div class="flex flex-wrap items-center justify-between gap-2.5"><span data-example-title class="text-[13px] font-bold"></span><span class="rounded-full bg-bg px-2.5 py-[3px] text-xs font-semibold text-fg-2" data-i18n="pref_illustrative"></span></div>
                <div class="grid gap-2 sm:grid-cols-3">
                  <div class="flex flex-col gap-1.5 rounded-[10px] bg-sunken px-3 py-2.5">
                    <span class="text-xs text-muted" data-i18n="pref_tuning_row1"></span>
                    <span class="flex flex-wrap items-baseline gap-1.5"><span class="text-[13px] text-faint line-through">8000 mm/s²</span><span class="text-[17px] font-bold text-warn">5000 mm/s²</span><span class="text-xs font-bold text-warn" data-i18n="pref_lower"></span></span>
                  </div><div class="flex flex-col gap-1.5 rounded-[10px] bg-sunken px-3 py-2.5">
                    <span class="text-xs text-muted" data-i18n="pref_tuning_row2"></span>
                    <span class="flex flex-wrap items-baseline gap-1.5"><span class="text-[13px] text-faint line-through">0.10 mm</span><span class="text-[17px] font-bold text-warn">0.15 mm</span><span class="text-xs font-bold text-warn" data-i18n="pref_higher"></span></span>
                  </div><div class="flex flex-col gap-1.5 rounded-[10px] bg-sunken px-3 py-2.5">
                    <span class="text-xs text-muted" data-i18n="pref_tuning_row3"></span>
                    <span class="flex flex-wrap items-baseline gap-1.5"><span class="text-[13px] text-faint line-through">95%</span><span class="text-[17px] font-bold text-warn">100%</span><span class="text-xs font-bold text-warn" data-i18n="pref_higher"></span></span>
                  </div>
                </div>
                <span class="text-[13px] leading-normal text-fg-2"><strong data-i18n="pref_tuning_verdict"></strong> <span data-i18n="pref_tuning_advice"></span></span>
              </div>
            </div>
          </div>
        </div>
        <div class="flex flex-col gap-5 rounded-[var(--pn-r-card)] bg-surface p-7">
          <div class="flex max-w-[760px] flex-col gap-1.5">
            <h3 id="assign-title" class="m-0 text-lg font-bold" data-i18n="assign_title"></h3>
            <p class="m-0 text-[15px] leading-[1.55] text-muted" data-i18n="assign_intro"></p>
          </div>
          <div role="radiogroup" aria-labelledby="assign-title" class="grid gap-3 md:grid-cols-3">
            <button type="button" role="radio" data-map-mode="compatible" class="radio-card">
                <span class="flex flex-wrap items-center gap-2.5"><span class="radio-dot"></span><span class="font-bold" data-i18n="assign_compatible"></span><span class="rounded-full bg-accent-soft px-2 py-[3px] text-xs font-bold text-accent-strong" data-i18n="pref_recommended"></span></span>
                <span class="text-sm leading-normal text-fg-2" data-i18n="assign_compatible_desc"></span>
                <span class="text-[13px] leading-normal text-muted"><strong class="text-fg" data-i18n="assign_pick_when"></strong> <span data-i18n="assign_compatible_when"></span></span>
              </button>
            <button type="button" role="radio" data-map-mode="exact" class="radio-card">
                <span class="flex flex-wrap items-center gap-2.5"><span class="radio-dot"></span><span class="font-bold" data-i18n="assign_exact"></span></span>
                <span class="text-sm leading-normal text-fg-2" data-i18n="assign_exact_desc"></span>
                <span class="text-[13px] leading-normal text-muted"><strong class="text-fg" data-i18n="assign_pick_when"></strong> <span data-i18n="assign_exact_when"></span></span>
              </button>
            <button type="button" role="radio" data-map-mode="slicer" class="radio-card">
                <span class="flex flex-wrap items-center gap-2.5"><span class="radio-dot"></span><span class="font-bold" data-i18n="assign_slicer"></span></span>
                <span class="text-sm leading-normal text-fg-2" data-i18n="assign_slicer_desc"></span>
                <span class="text-[13px] leading-normal text-muted"><strong class="text-fg" data-i18n="assign_pick_when"></strong> <span data-i18n="assign_slicer_when"></span></span>
              </button>
          </div>
          <div class="flex flex-col gap-3 rounded-[14px] bg-bg px-[18px] py-4">
            <span id="assign-example-title" class="text-[13px] font-bold"></span>
            <div id="assign-example" class="flex flex-wrap gap-3"></div>
          </div>
        </div>
        <div class="flex items-center gap-2 text-sm text-muted"><svg viewBox="0 0 24 24" class="size-4 text-accent" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg><span data-i18n="prefs_saved"></span></div>
      </section>

      <!-- My printers -->
      <section id="printers-section" class="flex scroll-mt-6 flex-col gap-5" aria-labelledby="printers-title">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <div class="flex flex-col gap-2">
            <h2 id="printers-title" class="m-0 text-[34px] tracking-[-0.5px]" data-i18n="printers_title"></h2>
            <p class="m-0 text-[17px] text-muted" data-i18n="printers_hint"></p>
          </div>
          <button id="add-printer" type="button" class="inline-flex min-h-11 items-center gap-2 rounded-full border-[1.5px] border-strong bg-surface px-[18px] text-[15px] font-semibold"><svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="printers_add_title"></span></button>
        </div>
        <ul id="printers" class="m-0 list-none overflow-hidden rounded-[var(--pn-r-card)] bg-surface p-0"></ul>

      </section>

      <!-- Convert a file manually -->
      <section id="convert" class="flex scroll-mt-6 flex-col gap-4" aria-labelledby="convert-title">
        <div class="flex flex-col gap-1.5">
          <h2 id="convert-title" class="m-0 font-sans text-xl font-bold" data-i18n="convert_title"></h2>
          <p class="m-0 text-[15px] text-muted" data-i18n="convert_intro"></p>
        </div>
        <form id="convert-form" class="flex flex-col gap-3" novalidate>
          <div class="flex flex-wrap items-stretch gap-3">
            <label id="dropzone" class="relative flex min-w-0 flex-[999_1_380px] cursor-pointer items-center gap-3.5 rounded-[var(--pn-r-tile)] border-2 border-dashed border-[var(--pn-border-dashed)] bg-surface px-[22px] py-[18px] data-[drag=true]:border-accent data-[drag=true]:bg-accent-tint">
              <svg viewBox="0 0 24 24" class="size-6 shrink-0 text-accent" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="M7 9l5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
              <span class="min-w-0 text-[15px] [overflow-wrap:anywhere]"><strong id="file-name" data-i18n="convert_drop_title"></strong> <span id="file-detail" class="text-muted" data-i18n="convert_drop_hint"></span></span>
              <input id="convert-file" type="file" accept=".3mf" class="sr-only" />
            </label>
            <label class="flex min-w-0 flex-[1_1_240px] flex-col gap-1 rounded-[var(--pn-r-tile)] border-[1.5px] border-line bg-surface px-[18px] py-2.5">
              <span class="text-xs font-semibold text-muted" data-i18n="convert_printer"></span>
              <select id="convert-printer" class="w-full min-w-0 truncate bg-transparent text-[15px] font-semibold"></select>
            </label>
            <button id="convert-button" type="submit" class="min-h-14 cursor-pointer rounded-[var(--pn-r-tile)] bg-accent px-7 text-base font-bold text-on-accent hover:bg-accent-strong disabled:cursor-not-allowed disabled:opacity-50" data-i18n="convert_button"></button>
          </div>
          <div id="convert-result" class="flex flex-col gap-3" hidden>
            <p id="convert-status" class="chip self-start" role="status" hidden></p>
            <ul id="convert-results" class="m-0 flex list-none flex-col gap-3 p-0" aria-live="polite"></ul>
            <p id="convert-tip" class="rounded-2xl bg-accent-soft px-4 py-3 text-sm" data-i18n="convert_tip" hidden></p>
          </div>
        </form>
      </section>
    </main>

    <footer class="border-t border-line">
      <div class="mx-auto max-w-[var(--pn-page-max)] px-6 py-6 text-xs text-muted">
        <p id="profiles-status" role="status" class="m-0"></p>
      </div>
    </footer>

    </div>

    <!-- Templates (cloned by options.ts) -->
    <template id="tpl-printer">
      <li class="flex flex-wrap items-center gap-4 border-b border-line-soft px-6 py-[18px] last:border-b-0">
        <span class="grid size-[52px] shrink-0 place-items-center rounded-[var(--pn-r-inner)] bg-bg">
          <img data-field="cover" class="size-11 object-contain mix-blend-multiply" alt="" />
          <svg data-field="placeholder" viewBox="0 0 24 24" class="size-7 text-faint" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z" /></svg>
        </span>
        <span class="flex min-w-0 flex-[1_1_220px] flex-col gap-0.5">
          <span class="flex flex-wrap items-center gap-2">
            <span data-field="name" class="font-bold"></span>
            <span data-field="brand" class="text-[13px] text-muted"></span>
            <span data-field="default" class="rounded-full bg-accent-soft px-2 py-[3px] text-xs font-bold text-accent-strong" data-i18n="printers_default" hidden></span>
          </span>
          <span data-field="setup" class="text-sm text-muted"></span>
        </span>
        <span class="flex flex-wrap items-center gap-2">
          <button data-action="default" type="button" class="row-action" data-i18n="printers_make_default" hidden></button>
          <button data-action="edit" type="button" class="row-action" data-i18n="printers_edit"></button>
        </span>
      </li>
    </template>

    <template id="tpl-result">
      <li class="card flex flex-col gap-3 p-4">
        <div class="flex items-start gap-3">
          <span class="grid size-12 shrink-0 place-items-center rounded-xl bg-white p-1">
            <img data-field="cover" class="size-full object-contain" alt="" />
            <svg data-field="placeholder" viewBox="0 0 24 24" class="size-6 text-accent" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z" /></svg>
          </span>
          <span class="flex min-w-0 flex-1 flex-col items-start gap-1.5">
            <span data-field="printer" class="max-w-full truncate font-bold"></span>
            <span data-field="status" class="chip max-w-full bg-sunken text-muted" role="status"></span>
            <span data-field="stats" class="text-xs text-muted" hidden></span>
          </span>
          <button data-field="show" type="button" class="btn shrink-0 rounded-full bg-sunken px-4 py-1.5 text-xs hover:bg-line" data-i18n="convert_show" hidden></button>
        </div>
        <div data-field="issue" class="flex flex-col gap-1 rounded-xl bg-err-soft p-3 text-sm" hidden>
          <span data-field="issue-message" class="font-semibold text-err"></span>
          <span data-field="issue-suggestion"></span>
        </div>
        <div data-field="map" hidden></div>
        <details data-field="details" class="border-t border-line pt-2" hidden>
          <summary class="cursor-pointer py-1 text-xs font-semibold text-muted" data-i18n="convert_report"></summary>
          <div data-field="report-panel" class="mt-2"></div>
        </details>
      </li>
    </template>

  </body>
</html>
