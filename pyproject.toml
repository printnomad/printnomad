# Configuración de desarrollo del monorepo (no es un paquete).
# Paquetes: core/ (printnomad) y orca-plugin/ (printnomad-orca).

[tool.pytest.ini_options]
pythonpath = ["core/src"]
testpaths = ["core/tests", "orca-plugin/tests", "tools/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# HTML/JS embebido y XML de prueba: el largo de línea no aplica.
"orca-plugin/printnomad_orca/panel_html.py" = ["E501"]
"conftest.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["printnomad", "printnomad_orca", "conftest"]
