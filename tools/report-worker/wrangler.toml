name = "printnomad-reports"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Private repository that receives the reports, as owner/name.
REPORTS_REPO = "printnomad/reports"
# Comma-separated extension ids allowed to send; empty: any chrome-extension:// origin.
# Set it once the Chrome Web Store id exists.
ALLOWED_EXTENSION_IDS = ""

# At most 5 reports per minute from one address.
[[ratelimits]]
name = "REPORT_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60
